[workspace]
members = [".", "experiments/hanabi_validation"]
resolver = "2"

[package]
name = "proc_A_dine01"
version = "0.1.1"
edition = "2021"
default-run = "proc_A_dine01"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bevy_preview_worker"
path = "src/bin/bevy_preview_worker.rs"

[features]
# `bevy_tilemap_adapter` is NOT default: opt-in `bevy_ecs_tilemap` 0.20 (render off).
# Keep OFF of `default` until adapter + runtime witness green; see src/dev/coder_remaining_post_019_v1.md.
default = []
# Extra Bevy entity/frame diagnostics plugins during `--test` runs (runtime latch still works without this).
test_instrumentation = []
# H-A2: optional Hanabi L3 embellishment (no default EnginePlugin registration).
hanabi_l3 = ["dep:bevy_hanabi"]
# Historical `src/engine/engine.rs` stub (DefaultPlugins + egui only). Canonical: `engine_with_worldgen::EnginePlugin`.
legacy_engine = []
# Optional research / ML prototypes (`engine::lmodels`); **stub only** — linfa crates are declared for
# future wiring; `cargo build --features research_lmodels` prints a `build.rs` warning. See module docs.
research_lmodels = [
    "dep:linfa",
    "dep:linfa-clustering",
    "dep:linfa-nn",
    "dep:linfa-ica",
    "dep:linfa-kernel",
]
# U6: `bevy_ecs_tilemap` with **render disabled** — headless-safe ECS + `TileTextureIndex` sync only.
bevy_tilemap_adapter = ["dep:bevy_ecs_tilemap"]
# U7: rule-trace component + materialize tracing (no extra deps).
dev_tools = ["bevy/bevy_dev_tools"]
# INFRA-E0-003: opt-in legacy ECS `Road` / `Rrails` stubs under `entities::structure`.
legacy_transport_ecs_stubs = []
# Optional detached native minimap host (consumer-only; **BQ-131**).
hud_native_minimap_window = []
# ENGINE-DEEP-DEBUG-001: intrusive minimap/GPU/schedule witnesses + Bevy diagnostics (see runbook).
engine_deep_debug = []
# PLAN-GPU-TERRAIN-P3: optional Tracy (not required for ship gate).
tracy = ["bevy/trace_tracy"]
# Per-system span timing to a Chrome trace JSON (`TRACE_CHROME=<path>`); measurement builds only.
trace_chrome = ["bevy/trace_chrome"]
# Lets a release build write the sim review dump (`RUST_ENGINE_SIM_DUMP=1`); used by
# `playcheck.py --release`. Never in shipped builds: debug builds always have the dump.
sim_dump = []
# `legacy_io_templates` removed 2026-04-26: src/io/templates.rs retired.

[package.metadata.'cargo-features']
glob = ["*"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Release builds compile out `debug!` / `trace!` (tracing + log macros, every crate); debug keeps all levels.
tracing = { version = "0.1", default-features = false, features = ["release_max_level_info"] }
log = { version = "0.4", default-features = false, features = ["release_max_level_info"] }
crossbeam-channel = "0.5"
ron = "0.8"
reqwest = { version = "0.11", features = ["json"] }
sha2 = "0.10"

# --- Bevy and UI (Bevy 0.20 line — PLAN-BEVY-020-MIG-v1) ---
bevy = { version = "0.20", features = ["serialize", "bevy_gizmos", "bevy_gizmos_render", "multi_threaded", "debug", "wav"] }
# PNG + GIF for gameplay capture.
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
bitflags = "2"
rustc-hash = "2.1"
bytemuck = { version = "1.14", features = ["derive"] }
smallvec = "1.13"
clap = { version = "4", features = ["derive"] }
# Optional: re-add bevy-inspector-ui when a release matches this Bevy line without duplicating ECS.
# bevy-inspector-ui = "…"

# --- World generation ---
noise = "0.8.2"
rayon = "1.10"
rand = "0.8.5"
rand_chacha = "0.3.1"
nalgebra = "0.32.2"
bevy_ecs_tilemap = { version = "0.20", optional = true, default-features = false }
bevy_hanabi = { version = "0.20", optional = true, default-features = false, features = ["3d"] }
bevy_vector_shapes = "0.14.0"

# Optional linfa stack for `research_lmodels` — **not integrated** in `engine::lmodels` yet (stub module).
linfa = { version = "0.8.1", optional = true, default-features = false }
linfa-clustering = { version = "0.8.1", optional = true, default-features = false }
linfa-nn = { version = "0.8.1", optional = true, default-features = false }
linfa-ica = { version = "0.8.1", optional = true, default-features = false }
linfa-kernel = { version = "0.8.1", optional = true, default-features = false }

# Removed from previous Cargo.toml (incompatible with wgpu / Bevy architecture):
#   imgui / retired_egui — retired; Bevy UI only
#   glfw       — OpenGL windowing; Bevy owns the window via winit
#   glm        — OpenGL math; use bevy::math / glam
#   gl         — OpenGL bindings; Bevy uses wgpu
#   glow       — OpenGL bindings; conflicts with wgpu
#   bevy_puffin — profiling plugin pinned to old Bevy; re-add when a compatible release exists

[profile.dev.package."*"]
opt-level = 3

# Our own crate at opt-level 1 in dev: ~10x faster debug frames (193 -> 20 ms avg),
# rebuild after a small edit ~90 s vs ~39 s. Use `--profile dev-deep-debug` for opt 0 stepping.
[profile.dev.package.proc_A_dine01]
opt-level = 1

[profile.dev-deep-debug]
inherits = "dev"
opt-level = 0
debug = 2
overflow-checks = true
incremental = true

[profile.dev-deep-debug.package.proc_A_dine01]
opt-level = 0

[lints.clippy]
too_many_arguments = "allow"
empty_line_after_outer_attr = "warn"
