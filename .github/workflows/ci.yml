# CI: Rust crate + Python asset-tools guardrails (ResourceType parity).
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # Backstop after the lib-harness deadlock fix. A stuck test used to ride the
    # GitHub default (360m) and cancel the job; this fails that step in bounded time.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Bevy → winit → wayland-sys uses pkg-config for `wayland-client` on Linux.
      - name: Install Linux build deps (Wayland / wgpu / winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libudev-dev \
            libasound2-dev

      - name: cargo check (default features)
        run: cargo check -p proc_A_dine01

      - name: cargo rustc lib (-D warnings) (STAB-CI-001)
        run: cargo rustc -p proc_A_dine01 --lib -- -D warnings

      - name: cargo check (bevy_tilemap_adapter)
        run: cargo check -p proc_A_dine01 --features bevy_tilemap_adapter

      - name: cargo test (lib)
        timeout-minutes: 60
        run: cargo test -p proc_A_dine01 --lib

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # PCI-14: pixel_conclude regression. Ubuntu has no pytest/Pillow, so the
      # step installs those pins (+ jsonschema: the CLI subprocess loads rust_engine_mcp.schemas)
      # then runs the gate. Budget is two minutes.
      - name: pixel conclude regression (PCI-14)
        timeout-minutes: 2
        env:
          PYTHONUTF8: "1"
          PYTHONPATH: tools/mcp/python
        run: |
          python -m pip install -q "pytest>=8.0" "Pillow>=10.0" "jsonschema>=4.0"
          python -m pytest tools/mcp/python/tests/test_pixel_conclude.py -q

      # PCI-27 gate: the smoke step below runs only while this pytest stays
      # inside the step budget. A timeout fails the job before the smoke.
      # Local measure 2026-09-25: 4 passed in 0.33s.
      - name: effect preview capture under two minutes (PCI-27)
        timeout-minutes: 2
        env:
          PYTHONUTF8: "1"
          PYTHONPATH: tools/mcp/python
        run: |
          python -m pip install -q "pytest>=8.0" "Pillow>=10.0" "jsonschema>=4.0"
          python -m pytest tools/mcp/python/tests/test_effect_preview_capture.py -q

      # PCI-27: CI runs the isolated effect-chain smoke (validate, preview-capture,
      # honest_gate, promote). No cron. No --witness, so the committed PCI-21
      # witness is not rewritten. force stays false inside the smoke.
      - name: effect-chain smoke (PCI-27)
        timeout-minutes: 2
        env:
          PYTHONUTF8: "1"
          PYTHONPATH: tools/mcp/python
        run: python -m rust_engine_mcp.cli effect-chain-smoke

      # PCI-38: scan assets/configs/buildings/_module_index.ron for missing GLBs.
      # Paths under assets/staging/ are skipped so untracked staging cannot fail CI.
      - name: orphan module registry (PCI-38)
        timeout-minutes: 2
        env:
          PYTHONUTF8: "1"
        run: python tools/orchestrator/scripts/check_orphan_modules.py

      - name: ResourceType vs RESOURCE_TYPES parity
        run: python src/utils/asset_tools/scripts/check_resource_parity.py

      - name: py_compile (asset_tools config + key pages)
        run: |
          python -m py_compile src/utils/asset_tools/src/config/asset_config.py
          python -m py_compile src/utils/asset_tools/src/config/content_constants.py
          python -m py_compile src/utils/asset_tools/src/pages/vehicle_page.py
          python -m py_compile src/utils/asset_tools/src/pages/power_page.py
