[package]
name = "rust_engine_orchestrator"
version = "0.1.0"
edition = "2021"
description = "Build-time architectural diagnostics orchestrator (intent-preserving, not warning deletion)"
publish = false

[[bin]]
name = "orchestrate"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1.10"
walkdir = "2.5"
