[project]
name = "rust-engine-mcp"
version = "0.1.0"
description = "Designer art MCP toolchain for Rust_engine_template_01"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0",
  "pydantic>=2.0",
  "jsonschema>=4.0",
]

[project.scripts]
rust-engine-art-mcp = "rust_engine_mcp.server:main"
module-viewer = "rust_engine_mcp.module_viewer_launcher:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rust_engine_mcp*"]
